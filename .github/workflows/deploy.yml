name: 'Deploy'

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - beta

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - name: Determine Version
        id: determine_version
        run: |
          UPSTREAM_VERSION="$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed 's/^v//' | sort -V | tail -1)"
          LAST_FORK_VERSION="$(git tag --list "v${UPSTREAM_VERSION}-creole-*" | sed -E 's/.*-creole-//' | grep -E '^[0-9]+$' | sort -n | tail -1)"
          FORK_VERSION="$(( ${LAST_FORK_VERSION:-1} + 1 ))"
          VERSION="${UPSTREAM_VERSION}-creole-${FORK_VERSION}"
          TAG_NAME="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tagName=$TAG_NAME" >> "$GITHUB_OUTPUT"
      - name: Validate Version Outputs
        run: |
          if [ -z "${{ steps.determine_version.outputs.version }}" ] || [ -z "${{ steps.determine_version.outputs.tagName }}" ]; then
            echo "No new release version was produced (likely already released)."
            exit 1
          fi
    outputs:
      version: ${{ steps.determine_version.outputs.version }}
      tagName: ${{ steps.determine_version.outputs.tagName }}

  build_win:
    needs: [version]
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:wine
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - name: Build
        run: |
          pnpm install --frozen-lockfile --config.platform=win32
          pnpm run build
          pnpm exec electron-builder \
            --win nsis portable \
            --config.extraMetadata.version="$VERSION" \
            --config.nsis.artifactName="OscGoesBrrr-windows-setup-${VERSION}.exe" \
            --config.portable.artifactName="OscGoesBrrr-windows-portable-${VERSION}.exe"
        env:
          HOME: /root
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/OscGoesBrrr-windows-setup-${{ needs.version.outputs.version }}.exe
            dist/OscGoesBrrr-windows-portable-${{ needs.version.outputs.version }}.exe

  build_linux:
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          standalone: true
      - name: Install rpm build tools
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec electron-builder \
            --linux AppImage rpm \
            --config.extraMetadata.version="$VERSION" \
            --config.appImage.artifactName="OscGoesBrrr-linux-${VERSION}.AppImage" \
            --config.rpm.artifactName="OscGoesBrrr-linux-${VERSION}.rpm"
        env:
          VERSION: ${{ needs.version.outputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/OscGoesBrrr-linux-${{ needs.version.outputs.version }}.AppImage
            dist/OscGoesBrrr-linux-${{ needs.version.outputs.version }}.rpm

  release:
    needs: [version, build_win, build_linux]
    runs-on: ubuntu-latest
    outputs:
      assets: ${{ steps.release.outputs.assets }}
    steps:
      - name: Fail If Tag Already Exists
        env:
          TAG_NAME: ${{ needs.version.outputs.tagName }}
        run: |
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --tags --refs "$REPO_URL" "refs/tags/${TAG_NAME}" | grep -q .; then
            echo "Tag ${TAG_NAME} already exists on origin."
            exit 1
          fi
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows
          path: windows
      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux
          path: linux
      - name: Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tagName }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ needs.version.outputs.version }}
          prerelease: ${{ github.ref_name != github.event.repository.default_branch }}
          files: |
            windows/OscGoesBrrr-windows-setup-${{ needs.version.outputs.version }}.exe
            windows/OscGoesBrrr-windows-portable-${{ needs.version.outputs.version }}.exe
            linux/OscGoesBrrr-linux-${{ needs.version.outputs.version }}.AppImage
            linux/OscGoesBrrr-linux-${{ needs.version.outputs.version }}.rpm
